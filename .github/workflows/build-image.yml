name: build-image
# Rebuild trigger: path-watched so image refreshes can be forced with a no-op edit (2026-11-27).
on:
  workflow_dispatch:
  push:
    branches: [asset-manager-correction]
    paths: [backend/Dockerfile, backend/.dockerignore, backend/requirements.txt, .github/workflows/build-image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/mythr00/cinemora:latest
