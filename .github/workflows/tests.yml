name: tests

# Phase 9 (F-05): the CI test gate. A red suite fails the check —
# there is deliberately no continue-on-error anywhere in this file.
# The backend job runs the FULL suite (the same command developers
# run locally, per the audit's exact brief); the frontend job runs
# the Vitest suite, the type check and the production build; the
# image job proves the production image builds and boots its OCR
# stack (D-03/C-11); the secrets job scans git history (E-23).

on:
  push:
    branches: [asset-manager-correction, main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System build packages for the Manim wheels
        # manimpango + pycairo build from source (no manylinux
        # wheels); they need the cairo/pango dev packages present
        # BEFORE pip install (GitHub Skills Programme, 2026-11-25).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libcairo2-dev libpango1.0-dev
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run the full backend suite with coverage (F-09)
        working-directory: backend
        run: |
          pip install pytest-cov
          mkdir -p "$RUNNER_TEMP/pytest-tmp"
          TMPDIR="$RUNNER_TEMP/pytest-tmp" python -m pytest -q \
            --cov=. --cov-report=xml:"$RUNNER_TEMP/coverage.xml"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/coverage.xml

  frontend:
    name: frontend suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Production build
        working-directory: frontend
        run: npm run build

  image-smoke:
    name: image build + OCR smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: true
          tags: cinemora:ci-smoke
      - name: Smoke — app imports and the OCR engine constructs (D-03)
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e REDIS_URL=redis://localhost:6379/15 \
            -e BREWKEG_API_KEY=ci-dummy \
            -e SERPER_API_KEY=ci-dummy \
            --entrypoint python \
            cinemora:ci-smoke \
            -c "import main; from services.frame_verification import _rapidocr_engine; engine = _rapidocr_engine(); assert engine is not None, 'OCR engine unavailable in image'; print('image smoke ok')"
      - name: Smoke — the Manim engine renders a chart in the image
        # GitHub Skills Programme (2026-11-25): proves the second
        # motion-graphics engine end to end inside the production
        # image (source-built manimpango/pycairo, pango runtime,
        # bundled-font fontconfig) — a real 2 s render through the
        # template contract, not just an import.
        run: |
          docker run --rm \
            --entrypoint python \
            cinemora:ci-smoke \
            -c "
          from services.motion_engine import manim_templates
          assert manim_templates.manim_available(), 'manim unavailable in image'
          data = {'points': [
              {'label': '1900', 'value': 5, 'display': '5'},
              {'label': '1910', 'value': 15, 'display': '15'},
              {'label': '1920', 'value': 30, 'display': '30'}],
              'title': 'CI smoke'}
          out, meta = manim_templates.manim_line_chart(data, 'editorial', '/tmp/ci-manim.mp4', duration=2.0)
          assert out and meta.get('engine') == 'manim', meta
          print('manim image smoke ok')
          "

  secrets:
    name: git-history secret scan (E-23)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
